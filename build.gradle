plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.services'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.services"
        minSdk 21
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
